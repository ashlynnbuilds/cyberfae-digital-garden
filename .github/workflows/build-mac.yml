
name: Build CYBERFAE for Mac

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Download CYBERFAE source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Mac downloads
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Upload Mac downloads
        uses: actions/upload-artifact@v4
        with:
          name: CYBERFAE-Mac-v0.3.0
          path: dist/*.dmg
          if-no-files-found: error
